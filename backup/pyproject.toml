[project]
name = "backup"
version = "0.1.0"
description = "Postgres backup/restore to S3 for the Chatwoot database. Same script runs on cron and manually -- see ADR 0002, D5."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "moto[s3]>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
