[project]
name = "rag-mcp"
version = "0.1.0"
description = "Self-hosted MCP server: semantic search over knowledge-base/ via pgvector + local fastembed embeddings. See docs/adr/0006."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
http = ["uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
