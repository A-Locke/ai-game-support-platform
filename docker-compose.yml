x-chatwoot-env: &chatwoot-env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USERNAME: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatwoot}
  POSTGRES_DATABASE: ${POSTGRES_DATABASE:-chatwoot}
  REDIS_URL: redis://redis:6379
  # Chatwoot's outgoing webhook delivery uses the ssrf_filter gem and refuses any destination
  # that resolves to a private IP range by default -- which includes every other container on
  # this same Compose network, ai-service among them ("Hostname 'ai-service' has no public ip
  # addresses"). This is Chatwoot's own documented escape hatch (lib/safe_fetch.rb) for exactly
  # this self-hosted, same-network case. See PROJECT_JOURNAL.md, Milestone 2.
  SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"

services:
  postgres:
    # Chatwoot's schema requires the pgvector extension (used by its native AI/RubyLLM
    # features) -- plain postgres:16 fails db:chatwoot_prepare with
    # 'extension "vector" is not available'. pgvector/pgvector ships it preinstalled.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatwoot}
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: runs migrations + seed data (the Procfile's "release" phase -- the Chatwoot
  # image does not run this automatically on boot, unlike some other Rails app images).
  # `chatwoot` and `chatwoot-sidekiq` wait for this to exit 0 before starting.
  chatwoot-prepare:
    image: chatwoot/chatwoot:latest
    environment:
      <<: *chatwoot-env
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatwoot:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    depends_on:
      chatwoot-prepare:
        condition: service_completed_successfully
    environment:
      <<: *chatwoot-env
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "3000:3000"
    volumes:
      - chatwoot_storage:/app/storage
    healthcheck:
      # wget/curl aren't guaranteed present in the Chatwoot image; Ruby always is.
      test: ["CMD", "ruby", "-rnet/http", "-ruri", "-e", "exit(Net::HTTP.get_response(URI('http://localhost:3000')).code.to_i < 500)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    depends_on:
      chatwoot-prepare:
        condition: service_completed_successfully
    environment:
      <<: *chatwoot-env
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage

  # Throwaway page embedding Chatwoot's live chat widget, standing in for "an existing company
  # website" (see docs/adr/0009). Just a static file server -- no Dockerfile, no build step; the
  # widget script itself talks straight to the chatwoot service, this container only serves the
  # HTML. Found live: opening the file directly as file:// breaks the widget (a file:// page is a
  # null origin, and the widget's calls beyond the initial script tag don't behave the same way
  # from one) -- it has to be served over real HTTP, hence this container rather than "just open
  # the file." On the "demo" profile, included by default via COMPOSE_PROFILES in .env.example --
  # a real deployment embeds the same script (README.md) into its own actual website instead and
  # can drop this profile (leave COMPOSE_PROFILES empty/unset) to skip running it entirely.
  widget-demo:
    image: python:3.12-alpine
    restart: unless-stopped
    profiles: ["demo"]
    working_dir: /site
    volumes:
      - ./widget-demo:/site:ro
    command: ["python", "-m", "http.server", "8080"]
    ports:
      - "8080:8080"
    depends_on:
      - chatwoot

  # Scheduled Postgres -> S3 backups, always on but inert until S3_BUCKET is set (see
  # docs/adr/0002, D8). Manual trigger: scripts/backup_now.sh. Restore: scripts/restore_from_s3.sh.
  backup:
    build:
      context: ./backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatwoot}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-chatwoot}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-chatwoot-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  # Self-hosted MCP server: semantic search over knowledge-base/ via pgvector (same Postgres
  # instance as Chatwoot, its own schema) + local zero-cost embeddings. See docs/adr/0006.
  rag-mcp:
    build:
      context: .
      dockerfile: rag-mcp/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAG_POSTGRES_HOST: postgres
      RAG_POSTGRES_PORT: 5432
      RAG_POSTGRES_USERNAME: postgres
      RAG_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatwoot}
      RAG_POSTGRES_DATABASE: ${POSTGRES_DATABASE:-chatwoot}
      RAG_KNOWLEDGE_BASE_DIR: /app/knowledge-base
      RAG_AUTH_TOKEN: ${RAG_AUTH_TOKEN}
      RAG_UI_USERNAME: ${RAG_UI_USERNAME:-admin}
      RAG_UI_PASSWORD: ${RAG_UI_PASSWORD}
      RAG_HTTP_HOST: 0.0.0.0
      RAG_HTTP_PORT: 8200
      RAG_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp-server:
    build:
      context: ./mcp-server
    restart: unless-stopped
    environment:
      MCP_CHATWOOT_BASE_URL: http://chatwoot:3000
      MCP_CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-1}
      MCP_CHATWOOT_API_ACCESS_TOKEN: ${MCP_CHATWOOT_API_ACCESS_TOKEN:-${CHATWOOT_API_ACCESS_TOKEN}}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      MCP_ENABLE_MUTATIONS: ${MCP_ENABLE_MUTATIONS:-true}
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8100
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opt-in: the automated webhook-driven pipeline, needing ANTHROPIC_API_KEY. Not started by
  # `docker compose up -d` alone -- use `docker compose --profile automated up -d`, or run
  # `python -m app.cli` / a Claude Code MCP routine instead. See docs/adr/0003.
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    profiles: ["automated"]
    restart: unless-stopped
    depends_on:
      - mcp-server
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      MCP_SERVER_URL: http://mcp-server:8100/mcp
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      AI_WEBHOOK_SHARED_SECRET: ${AI_WEBHOOK_SHARED_SECRET}
      SUPPORT_CATEGORIES: ${SUPPORT_CATEGORIES:-Bug,Crash,Technical,Installation,Account,Performance,Billing,Feature Request,Feedback,Other}
      KNOWLEDGE_BASE_DIR: /app/knowledge-base
      JIRA_MCP_URL: ${JIRA_MCP_URL:-}
      JIRA_MCP_API_TOKEN: ${JIRA_MCP_API_TOKEN:-}
      JIRA_JQL_PROJECT_FILTER: ${JIRA_JQL_PROJECT_FILTER:-}
      AZURE_DEVOPS_MCP_URL: ${AZURE_DEVOPS_MCP_URL:-}
      AZURE_DEVOPS_MCP_PAT: ${AZURE_DEVOPS_MCP_PAT:-}
      GROUNDING_MAX_RESULTS: ${GROUNDING_MAX_RESULTS:-3}
      RAG_MCP_URL: http://rag-mcp:8200/mcp
      RAG_MCP_AUTH_TOKEN: ${RAG_AUTH_TOKEN}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  chatwoot_storage:
